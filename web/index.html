<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kiwoom-auto</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/web/style.css?v=3">
<script src="/web/vendor/lwc.standalone.js"></script>
</head>
<body>
<header>
  <strong>kiwoom-auto</strong>
  <span id="vds" class="grp"></span>
  <span id="tfs" class="grp"></span>
  <span id="mode" class="tag">-</span>
  <span id="quote" class="tag">-</span>
</header>
<main>
  <section id="chartWrap"><div id="chart" style="min-height:400px"></div></section>
  <aside>
    <div class="box">
      <h3>애드온 트리 <span id="addWrap"></span></h3>
      <div id="tree"></div>
    </div>
    <div class="box"><h3>전략</h3><div id="eval" class="mono">-</div></div>
    <div class="box"><h3>주문</h3>
      <div class="row"><input id="qty" type="number" value="1" min="1"></div>
      <label><input id="mkt" type="checkbox" checked> 시장가</label>
      <div class="row"><button id="buy" class="buy">매수</button><button id="sell" class="sell">매도</button></div>
    </div>
    <div class="box"><h3>잔고</h3><div id="bal" class="mono">-</div></div>
  </aside>
</main>
<footer><div id="log" class="mono"></div></footer>
<script type="module" src="/web/js/app.js?v=3"></script>
</body>
</html>
